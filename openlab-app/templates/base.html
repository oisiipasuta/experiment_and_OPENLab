<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}音楽好みプロフィール{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{{ url_for('index') }}">音楽好みプロフィール</a>
            <nav class="header-nav" aria-label="Primary">
                <a href="{{ url_for('index') }}">トップ</a>
                <a href="{{ url_for('experiment_instructions') }}">作成の流れ</a>
                <a href="{{ url_for('participant_info') }}">基本情報</a>
                {% if session.get("admin_authenticated") %}
                    <a href="{{ url_for('admin') }}">管理画面</a>
                    <form class="nav-logout-form" action="{{ url_for('admin_logout') }}" method="post">
                        <button type="submit">ログアウト</button>
                    </form>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container page">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="flash-stack" aria-label="Notifications">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
